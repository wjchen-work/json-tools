name: Release

# 推送 v* 标签时触发（例如 v1.0.0）：
# 构建默认 base 的产物，打包并创建 GitHub Release。
# Pages 部署见 pages.yml（推 master 时触发，走 GitHub Actions 工件）。
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 不传 VITE_BASE_PATH，base 走默认的 '/'，解压后可放在任意路径提供
      - name: 构建（含类型检查）
        run: pnpm build

      - name: 打包构建产物
        run: |
          cd dist
          zip -r "../json-tools-${{ github.ref_name }}.zip" .

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: json-tools-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
